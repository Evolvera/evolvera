      const flow=selectedFlow(), activeRel=new Set((flow?.steps||[]).flatMap(s=>s.relationshipIds||[])), activeEntities=flowEntityIds(flow);

      for(const node of model.nodes){const p=positions.get(node.id),isActive=!flow||activeEntities.has(node.id)||model.path.has(node.id),g=svg('g',{class:`node ${node._type}${node.kind==='external'?' external':''}${state.selected===node.id?' selected':''}${!isActive?' dim':''}`,transform:`translate(${p.x} ${p.y})`,tabindex:'0',role:'button','aria-label':`${node.name}, ${node.kind}`,'data-id':node.id});g.appendChild(svg('rect',{width:190,height:58,rx:9}));appendText(g,(node.name||node.id).slice(0,26),'',{x:13,y:24});appendText(g,`${node._type} · ${node.kind}`.toUpperCase(),'meta',{x:13,y:43});const childCount=childrenOf(node.id).length;if(childCount){g.setAttribute('aria-label',`${node.name}, ${node.kind}, ${childCount} children; double-click or Enter to enter`);g.appendChild(svg('rect',{x:132,y:9,width:48,height:16,rx:8,class:'badge-bg'}));appendText(g,`OPEN ${childCount}`,'badge-text',{x:138,y:20})}g.addEventListener('click',()=>select(node.id,'entity'));g.addEventListener('dblclick',()=>drillInto(node.id));g.addEventListener('keydown',e=>{if(e.key==='Enter'&&childCount){e.preventDefault();drillInto(node.id)}else if(e.key===' '){e.preventDefault();select(node.id,'entity')}});nodeHost.appendChild(g)}
      $('notice').textContent=model.hiddenNodes||model.hiddenEdges||model.overflowCount?`${model.hiddenNodes} items and ${model.hiddenEdges} relationships are grouped while showing ${lodNames[model.lod].toLowerCase()}.${model.overflowCount?` ${model.overflowCount} selected path items are represented by one aggregate; every ordered step remains in the Inspector.`:''} Zoom in or enter a subsystem for more detail.`:'';
      $('lod').textContent=state.focusId?`Inside · ${lodNames[model.lod].toLowerCase()}`:'Overview';renderContext();applyTransform();renderMinimap(model);renderTree(model.nodes);
    }
    function applyTransform(){ $('viewport').setAttribute('transform',`translate(${state.x} ${state.y}) scale(${state.scale})`) }
    function renderMinimap(model){const host=$('minimap');clear(host);host.setAttribute('viewBox',`0 0 ${graphBounds.w} ${graphBounds.h}`);for(const edge of model.edges){const a=positions.get(edge.fromId),b=positions.get(edge.toId);if(a&&b)host.appendChild(svg('line',{x1:a.x+190,y1:a.y+29,x2:b.x,y2:b.y+29,stroke:'#33434c','stroke-width':Math.max(2,graphBounds.w/250)}))}for(const node of model.nodes){const p=positions.get(node.id);host.appendChild(svg('rect',{x:p.x,y:p.y,width:190,height:58,rx:5,fill:state.selected===node.id?'#64d9d0':'#52626b'}))}}
    function fitGraph(){const box=$('graph').getBoundingClientRect();state.scale=Math.max(.48,Math.min(1,(box.width-50)/graphBounds.w,(box.height-150)/graphBounds.h));state.x=(box.width-graphBounds.w*state.scale)/2;state.y=120+(box.height-150-graphBounds.h*state.scale)/2;applyTransform();renderContext()}
    function setZoom(next,cx,cy){const old=state.scale,stateLod=currentLod();state.scale=Math.max(.38,Math.min(2.25,next));const box=$('graph').getBoundingClientRect(),x=cx??box.width/2,y=cy??box.height/2;state.x=x-(x-state.x)*(state.scale/old);state.y=y-(y-state.y)*(state.scale/old);applyTransform();if(currentLod()!==stateLod)renderGraph();else renderContext()}
    function hitTestComponent(clientX,clientY){const box=$('graph').getBoundingClientRect(),gx=(clientX-box.left-state.x)/state.scale,gy=(clientY-box.top-state.y)/state.scale;for(const [id,p] of positions)if(gx>=p.x&&gx<=p.x+190&&gy>=p.y&&gy<=p.y+58&&childrenOf(id).length)return id;return null}
    function centerOn(id){const p=positions.get(id);if(!p)return;const box=$('graph').getBoundingClientRect();state.x=box.width/2-(p.x+95)*state.scale;state.y=box.height/2-(p.y+29)*state.scale;applyTransform()}

    function addSection(host,title,items,renderer){if(!items.length)return;host.appendChild(el('div','section-title',title));for(const item of items)host.appendChild(renderer(item))}
    function detailRecord(item,type){
      const host=$('detail-body');clear(host);host.append(el('div','eyebrow',type),el('h3','',item.name||item.title||item.claim||item.id));if(item.description)host.appendChild(el('p','description',item.description));
      const facts=el('div','facts');for(const [k,v] of [['ID',item.id],['Kind',item.kind||item.type||item.status||'evidence'],['Confidence',item.confidence||'n/a'],['Level',item.level??'n/a']]){const box=el('div','fact');box.append(el('b','',k),el('span','',v));facts.appendChild(box)}host.appendChild(facts);
      if(type==='flow'){
        addSection(host,'Ordered path',item.steps||[],step=>{const row=el('div','step-row');row.append(el('b','',step.order),document.createTextNode(step.action));const meta=[step.input&&`in: ${step.input}`,step.output&&`out: ${step.output}`,step.stateChange&&`state: ${step.stateChange}`].filter(Boolean).join(' · ');if(meta)row.appendChild(el('small','',meta));return row});
        addSection(host,'Outcomes',item.outcomes||[],x=>el('div','link-row',x));addSection(host,'Failure modes',item.failureModes||[],x=>el('div','link-row',x));
      }
      if(type==='entity'){
        const links=data.relationships.filter(r=>r.fromId===item.id||r.toId===item.id);addSection(host,'Relationships',links,r=>{const other=entity.get(r.fromId===item.id?r.toId:r.fromId);const row=el('button','link-row',`${r.kind} · ${other?.name||'unknown'}`);row.type='button';row.setAttribute('role','button');row.addEventListener('click',()=>{if(component.has(other?.id)&&!isWithinFocus(other.id))state.focusId=parentContextFor(other.id);select(other?.id,'entity')});return row});
        const related=data.flows.filter(f=>flowEntityIds(f).has(item.id));addSection(host,'Flows',related,f=>{const row=el('button','link-row',f.name);row.type='button';row.addEventListener('click',()=>select(f.id,'flow'));return row});
      }
      const ids=new Set(item.evidenceIds||[]);if(type==='entity')for(const r of data.relationships)if((r.fromId===item.id||r.toId===item.id))for(const id of r.evidenceIds||[])ids.add(id);
      addSection(host,'Evidence',[...ids].map(id=>evidence.get(id)).filter(Boolean),ev=>{const row=el('div','evidence-row',ev.claim);row.appendChild(el('small','',`${ev.path}${ev.symbol?` · ${ev.symbol}`:''}${ev.startLine?`:${ev.startLine}`:''}`));return row});
      const gaps=data.gaps.filter(g=>(g.evidenceIds||[]).some(id=>ids.has(id)));addSection(host,'Related gaps',gaps,g=>{const row=el('div',`gap-row ${g.status}`,g.title);row.appendChild(el('small','',`${g.status} · ${g.question}`));return row});
      addTreeShell(host);
    }
    function renderDetail(){
      if(state.selectedType==='flow'&&flowMap.has(state.selected)){detailRecord(flowMap.get(state.selected),'flow');return}
      if(state.selectedType==='entity'&&entity.has(state.selected)){detailRecord(entity.get(state.selected),'entity');return}
      if(state.selectedType==='evidence'&&evidence.has(state.selected)){detailRecord(evidence.get(state.selected),'evidence');return}
      if(state.selectedType==='gap'){const gap=data.gaps.find(x=>x.id===state.selected);if(gap){detailRecord(gap,'gap');return}}
      const host=$('detail-body');clear(host);host.append(el('div','eyebrow','Map status'),el('h3','',data.snapshot.scope),el('p','description',data.project.description||'Select a node or flow to inspect its relationships and evidence.'));
      const facts=el('div','facts');for(const [k,v] of [['Head',data.snapshot.sourceHead==='UNKNOWN'?'UNKNOWN':data.snapshot.sourceHead.slice(0,8)],['Confidence',data.snapshot.confidence],['Open gaps',data.gaps.filter(g=>g.status==='open').length],['Schema',data.schemaVersion]]){const box=el('div','fact');box.append(el('b','',k),el('span','',v));facts.appendChild(box)}host.appendChild(facts);
      addSection(host,'Open questions',data.gaps.filter(g=>g.status==='open'),g=>{const row=el('div','gap-row open',g.title);row.appendChild(el('small','',g.question));return row});addTreeShell(host);
    }
    function addTreeShell(host){const details=el('details','tree-alt');details.appendChild(el('summary','','Keyboard tree alternative'));const list=el('div','tree-list');list.id='tree-list';list.setAttribute('role','tree');details.appendChild(list);host.appendChild(details)}
    function renderTree(nodes){const host=$('tree-list');if(!host)return;clear(host);for(const node of nodes){const b=el('button','tree-item',node.name);b.type='button';b.dataset.level=String(node.level||0);b.setAttribute('role','treeitem');b.setAttribute('aria-level',String((node.level||0)+1));b.addEventListener('click',()=>select(node.id,'entity'));host.appendChild(b)}}
    function select(id,type){state.selected=id;state.selectedType=type;if(type==='flow'){state.focusId=null;state.scale=.78;state.x=30;state.y=110;const f=flowMap.get(id);const tabByType={user:'User Flows',data:'Data Flows',runtime:'Runtime',failure:'Runtime',build:'Delivery',deploy:'Delivery'};if(f&&state.tab==='Evidence & Gaps')state.tab=tabByType[f.type]||'Architecture'}if(type==='entity'&&state.tab==='Evidence & Gaps')state.tab='Architecture';renderAll();if(type==='entity')centerOn(id)}

    function setupSearch(){
      const input=$('search'),results=$('search-results');input.addEventListener('input',()=>{const q=input.value.trim().toLowerCase();clear(results);if(!q){results.hidden=true;return}const matches=allRecords.filter(x=>[x.name,x.title,x.claim,x.id,x.description,x.path].filter(Boolean).join(' ').toLowerCase().includes(q)).slice(0,18);if(!matches.length)results.appendChild(el('div','empty','No matching architecture records.'));for(const item of matches){const type=flowMap.has(item.id)?'flow':entity.has(item.id)?'entity':evidence.has(item.id)?'evidence':'gap';const b=el('button','search-result',item.name||item.title||item.claim||item.id);b.type='button';b.appendChild(el('small','',`${type} · ${item.id}`));b.addEventListener('click',()=>{input.value='';results.hidden=true;if(type==='evidence'||type==='gap')state.tab='Evidence & Gaps';else if(type==='flow'){const f=flowMap.get(item.id),map={user:'User Flows',data:'Data Flows',runtime:'Runtime',failure:'Runtime',build:'Delivery',deploy:'Delivery'};state.tab=map[f.type]}else state.tab='Architecture';if(type==='entity'&&component.has(item.id)){state.focusId=parentContextFor(item.id);state.scale=1}select(item.id,type)});results.appendChild(b)}results.hidden=false});input.addEventListener('keydown',e=>{if(e.key==='Escape'){input.value='';results.hidden=true}});document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))results.hidden=true})
    }
    function setupGraphControls(){
      $('zoom-in').addEventListener('click',()=>{animateViewport();setZoom(state.scale*1.32)});$('zoom-out').addEventListener('click',()=>{animateViewport();setZoom(state.scale/1.32)});$('fit').addEventListener('click',()=>{animateViewport();fitGraph()});$('context-up').addEventListener('click',upContext);$('reset').addEventListener('click',()=>{state.selected=null;state.selectedType=null;setContext(null)});
      const graph=$('graph');graph.addEventListener('wheel',e=>{e.preventDefault();pendingWheel={delta:e.deltaY,cx:e.clientX-graph.getBoundingClientRect().left,cy:e.clientY-graph.getBoundingClientRect().top,clientX:e.clientX,clientY:e.clientY};if(zoomFrame)return;zoomFrame=requestAnimationFrame(()=>{zoomFrame=0;const z=pendingWheel;pendingWheel=null;const now=performance.now(),zoomingIn=z.delta<0;setZoom(state.scale*Math.exp(-z.delta*.0015),z.cx,z.cy);if(now-lastSemanticChange>DRILL_COOLDOWN_MS&&zoomingIn&&state.scale>SEMANTIC_DRILL_THRESHOLD){const hit=hitTestComponent(z.clientX,z.clientY);if(hit)drillInto(hit)}else if(now-lastSemanticChange>DRILL_COOLDOWN_MS&&!zoomingIn&&state.focusId&&state.scale<SEMANTIC_EXIT_THRESHOLD)upContext()})},{passive:false});
      graph.addEventListener('pointerdown',e=>{pointer={id:e.pointerId,x:e.clientX,y:e.clientY,ox:state.x,oy:state.y};state.dragging=true;state.moved=false;$('context-bar').closest('.stage').classList.add('dragging');graph.setPointerCapture(e.pointerId)});graph.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;if(Math.abs(dx)+Math.abs(dy)>3)state.moved=true;state.x=pointer.ox+dx;state.y=pointer.oy+dy;applyTransform()});graph.addEventListener('pointerup',e=>{if(pointer?.id===e.pointerId){pointer=null;state.dragging=false;$('context-bar').closest('.stage').classList.remove('dragging')}});
      graph.addEventListener('keydown',e=>{const amount=e.shiftKey?60:24;if(e.key==='ArrowLeft')state.x+=amount;else if(e.key==='ArrowRight')state.x-=amount;else if(e.key==='ArrowUp')state.y+=amount;else if(e.key==='ArrowDown')state.y-=amount;else return;e.preventDefault();applyTransform()});
    }
    function renderPrint(){const host=$('print-summary');clear(host);host.append(el('h1','',`${data.project.name} — architecture summary`),el('p','',`${data.snapshot.scope} · ${data.snapshot.confidence} · ${data.snapshot.lastVerifiedAt}`));const table=el('table'),head=el('tr');for(const x of ['Surface','Count'])head.appendChild(el('th','',x));table.appendChild(head);for(const [name,count] of [['Actors',data.actors.length],['Components',data.components.length],['Data objects',data.dataObjects.length],['Relationships',data.relationships.length],['Flows',data.flows.length],['Evidence',data.evidence.length],['Open gaps',data.gaps.filter(g=>g.status==='open').length]]){const row=el('tr');row.append(el('td','',name),el('td','',count));table.appendChild(row)}host.appendChild(table)}
    function renderAll(){renderHeader();renderTabs();renderFlows();renderDetail();renderGraph();renderPrint()}
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.focusId&&!e.target.matches('input,textarea,[contenteditable="true"]')){e.preventDefault();upContext()}});
    setupSearch();setupGraphControls();renderAll();
  })();
  </script>
</body>
