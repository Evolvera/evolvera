inferences_made:
  - id: "I001"
    based_on: ["F001", "F002"]
    inference_text: "Practical pattern: require a prompt change request to include success criteria, eval cases, and a routing diagnosis. Use prompt editing only when the target failure is controllable by instructions; route to model choice, retrieval, latency budget, or tool design otherwise. Validation oracle: failing eval becomes passing without unacceptable regressions in latency/cost."
    confidence: "high"
    caveats: "Anthropic guidance is Claude-oriented, but the success-criteria-before-prompting principle is model-agnostic. It fails when no representative eval set exists."
  - id: "I002"
    based_on: ["F003", "F005", "F006"]
    inference_text: "Practical pattern: encode output contracts as schemas plus explicit runtime states, not as prose like 'return valid JSON'. Use when downstream code consumes model output, when fields/enums are safety-critical, or when failures need automatic retry/rollback. Validation oracle: schema adherence, refusal detection, truncation detection, and content-filter handling."
    confidence: "high"
    caveats: "Schema adherence does not prove factual correctness. Supported-schema and model availability constraints must be checked per provider and model version."
  - id: "I003"
    based_on: ["F003", "F004"]
    inference_text: "Practical pattern: separate three contracts: instruction prompt, tool-call schema, and final-response schema. Tool schemas describe allowed system actions; final-response schemas describe user-facing artifacts. This changes architecture by moving action selection and output validation into typed interfaces."
    confidence: "high"
    caveats: "The retrieved evidence is OpenAI-specific. Other providers may expose different mechanics, but the separation remains useful conceptually."
  - id: "I004"
    based_on: ["F007", "F008", "F009"]
    inference_text: "Practical pattern: treat prompt optimization as CI search over candidate prompts. Generate variants, score against held-out evals, promote only with measurable gains, and store losing variants as regression evidence. Use when tasks have repeatable examples and measurable metrics."
    confidence: "medium"
    caveats: "APE/APO benchmark gains may not transfer to open-ended agentic tasks. Automatic optimization can overfit eval sets or discover brittle wording."
  - id: "I005"
    based_on: ["F010", "F011"]
    inference_text: "Practical pattern: replace monolithic prompts with typed, composable prompt modules whose signatures, demonstrations, retrieval inputs, and metrics are versioned. Use when a workflow has multiple reasoning/retrieval/tool steps or must migrate between models."
    confidence: "high"
    caveats: "DSPy evidence is from research case studies; production adoption still requires observability, security review, cost controls, and human rollback processes."
  - id: "I006"
    based_on: ["F001", "F006", "F009", "F011"]
    inference_text: "Shortlist for a PI skill: prompt contract header, typed output schema, state-separated context assembly, eval gates, adversarial/regression suite, prompt optimizer hook, model-routing gate, and release metadata. The non-obvious leverage is to make each prompt a deployable artifact with tests and failure states."
    confidence: "medium"
    caveats: "This synthesizes multiple sources but lacks direct retrieved evidence for observability, prompt caching, and prompt linting because those sources were blocked."
