    claim: "Anthropic frames prompt engineering as downstream of explicit success criteria and empirical tests, not as first-step prose editing."
    claim_type: "fact"
    confidence: "high"
    raw_data: "Before prompt engineering: This guide assumes that you have: 1. A clear definition of the success criteria for your use case 2. Some ways to empirically test against those criteria 3. A first draft prompt you want to improve"
    source_url: "https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview"
    source_type: "official vendor documentation"
    source_date: null
    access_method: "Jina Reader"
    context: "Anthropic's prompt engineering overview explicitly places evaluations and success criteria before prompt iteration. Publication date was unavailable from the retrieved page."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F002"
    claim: "Anthropic says prompt engineering is not always the right lever; model selection may better improve latency and cost."
    claim_type: "fact"
    confidence: "high"
    raw_data: "Not every success criteria or failing eval is best solved by prompt engineering. For example, you can sometimes improve latency and cost more easily by selecting a different model."
    source_url: "https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview"
    source_type: "official vendor documentation"
    source_date: null
    access_method: "Jina Reader"
    context: "This directly supports a production gate: decide whether a failure belongs to prompt text, model choice, retrieval, latency budget, or architecture."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F003"
    claim: "OpenAI Structured Outputs are designed to enforce JSON Schema adherence, reducing reliance on strongly worded formatting prompts."
    claim_type: "fact"
    confidence: "high"
    raw_data: "Structured Outputs is a feature that ensures the model will always generate responses that adhere to your supplied JSON Schema, so you don’t need to worry about the model omitting a required key, or hallucinating an invalid enum value. Some benefits of Structured Outputs include: 1. Reliable type-safety... 3. Simpler prompting: No need for strongly worded prompts to achieve consistent formatting"
    source_url: "https://platform.openai.com/docs/guides/structured-outputs"
    source_type: "official vendor documentation"
    source_date: "2026-07-22"
    access_method: "Jina Reader"
    context: "The page date is later than the user-supplied current date due the runtime environment; treat the timestamp cautiously. The material point is architectural: schema constraints move output contracts out of prose and into API-level validation."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F004"
    claim: "OpenAI distinguishes structured outputs for user-facing responses from function calling for connecting models to tools, functions, and data."
    claim_type: "fact"
    confidence: "high"
    raw_data: "Function calling is useful when you are building an application that bridges the models and functionality of your application... Conversely, Structured Outputs via response_format are more suitable when you want to indicate a structured schema for use when the model responds to the user"
    source_url: "https://platform.openai.com/docs/guides/structured-outputs"
    source_type: "official vendor documentation"
    source_date: "2026-07-22"
    access_method: "Jina Reader"
    context: "This supports a prompt-contract split: tool invocation schemas are not the same contract as final-answer schemas."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F005"
    claim: "OpenAI states JSON mode guarantees valid JSON but not schema adherence, whereas Structured Outputs guarantee both within supported schemas."
    claim_type: "fact"
    confidence: "high"
    raw_data: "Structured Outputs vs JSON mode... While both ensure valid JSON is produced, only Structured Outputs ensure schema adherence... We recommend always using Structured Outputs instead of JSON mode when possible."
    source_url: "https://platform.openai.com/docs/guides/structured-outputs"
    source_type: "official vendor documentation"
    source_date: "2026-07-22"
    access_method: "Jina Reader"
    context: "Useful as a validation oracle: JSON parse success is insufficient for production contracts; schema validation or native structured output is the stronger gate."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F006"
    claim: "OpenAI documents structured-output failure handling for truncation, refusal, and content-filter interruption."
    claim_type: "fact"
    confidence: "high"
    raw_data: "Check if the conversation was too long for the context window, resulting in incomplete JSON... Check if the OpenAI safety system refused the request and generated a refusal instead... Check if the model's output included restricted content, so the generation of JSON was halted and may be partial"
    source_url: "https://platform.openai.com/docs/guides/structured-outputs"
    source_type: "official vendor documentation"
    source_date: "2026-07-22"
    access_method: "Jina Reader"
    context: "This turns prompt contracts into runtime state machines: completed, truncated, refusal, filtered, parse/schema failure."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F007"
    claim: "APE treats an instruction as a program and selects candidate prompts by optimizing a score function over model-proposed instructions."
    claim_type: "fact"
    confidence: "high"
    raw_data: "we propose Automatic Prompt Engineer (APE) for automatic instruction generation and selection. In our method, we treat the instruction as the \"program,\" optimized by searching over a pool of instruction candidates proposed by an LLM in order to maximize a chosen score function."
    source_url: "https://arxiv.org/abs/2211.01910"
    source_type: "arXiv paper"
    source_date: "2023-03-10"
    access_method: "Jina Reader"
    context: "The key production idea is not the generated wording itself but the evaluation loop: candidate generation, scoring, and selection."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F008"
    claim: "APE reported automatically generated instructions outperforming an LLM baseline and matching or beating human annotator instructions on 19 of 24 NLP tasks."
    claim_type: "fact"
    confidence: "medium"
    raw_data: "Experiments on 24 NLP tasks show that our automatically generated instructions outperform the prior LLM baseline by a large margin and achieve better or comparable performance to the instructions generated by human annotators on 19/24 tasks."
    source_url: "https://arxiv.org/abs/2211.01910"
    source_type: "arXiv paper"
    source_date: "2023-03-10"
    access_method: "Jina Reader"
    context: "Useful evidence that optimization loops can improve prompts, but benchmark task transfer to PI production skills is uncertain."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F009"
    claim: "Automatic Prompt Optimization uses training data, natural-language gradients, prompt edits, beam search, and bandit selection to improve prompts."
    claim_type: "fact"
    confidence: "high"
    raw_data: "The algorithm uses minibatches of data to form natural language \"gradients\" that criticize the current prompt. The gradients are then \"propagated\" into the prompt by editing the prompt in the opposite semantic direction of the gradient. These gradient descent steps are guided by a beam search and bandit selection procedure"
    source_url: "https://arxiv.org/abs/2305.03495"
    source_type: "arXiv paper"
    source_date: "2023-10-19"
    access_method: "Jina Reader"
    context: "This is a production pattern for prompt changes: diff prompts using failure examples and evaluate candidates on minibatches before promotion."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F010"
    claim: "DSPy criticizes hard-coded prompt templates and proposes declarative modules compiled into optimized LM pipelines."
    claim_type: "fact"
    confidence: "high"
    raw_data: "existing LM pipelines are typically implemented using hard-coded \"prompt templates\", i.e. lengthy strings discovered via trial and error. Toward a more systematic approach... we introduce DSPy, a programming model that abstracts LM pipelines as text transformation graphs... where LMs are invoked through declarative modules."
    source_url: "https://arxiv.org/abs/2310.03714"
    source_type: "arXiv paper"
    source_date: "2023-10-05"
    access_method: "Jina Reader"
    context: "Directly addresses the mission distinction between isolated prose and prompt systems."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F011"
    claim: "DSPy modules are parameterized and can learn demonstrations for prompting, finetuning, augmentation, and reasoning techniques."
    claim_type: "fact"
    confidence: "high"
    raw_data: "DSPy modules are parameterized, meaning they can learn (by creating and collecting demonstrations) how to apply compositions of prompting, finetuning, augmentation, and reasoning techniques. We design a compiler that will optimize any DSPy pipeline to maximize a given metric."
    source_url: "https://arxiv.org/abs/2310.03714"
    source_type: "arXiv paper"
    source_date: "2023-10-05"
    access_method: "Jina Reader"
    context: "Supports compiling prompt programs against metrics instead of hand-tuning one prompt at a time."
    contradictions_expected: []
