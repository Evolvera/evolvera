agent_id: "methodical"
tema: "Best-supported prompt-engineering methods for production LLM systems"
data_coleta: "2026-07-18"
missao_id: null
missao_cumprida: true
justificativa_missao: "Evidence package assembled from directly accessed primary academic records on chain-of-thought, self-consistency, ReAct/tool use, retrieval interleaving, long-context effects, and first-party OpenAI technical documentation on instruction structure, few-shot examples, structured outputs, context, model dependence, and eval-driven production iteration. Some requested areas, especially least-to-most prompting and prompt optimization papers, could not be directly retrieved during this run due HTTP 429 and are recorded as gaps rather than asserted."
findings:
  - id: "F001"
    claim: "Prompt-engineering methods are model- and task-dependent; production systems should not assume one prompt style works universally and should use pinned model snapshots plus evaluations when changing prompts or models."
    claim_type: "fact"
    confidence: "high"
    raw_data: "source_title: Prompt engineering | OpenAI API; evidence_type: first-party technical documentation; literal_excerpt: \"Because the content generated from a model is non-deterministic, prompting to get your desired output is a mix of art and science. However, you can apply techniques and best practices to get good results consistently. Some prompt engineering techniques work with every model, like using message roles. But different model types (like reasoning versus GPT models) might need to be prompted differently to produce the best results. Even different snapshots of models within the same family could produce different results. So as you build more complex applications, we strongly recommend: Pinning your production applications to specific model snapshots ... Building tests and evaluation suites that measure prompt behavior so you can monitor performance as you iterate, or when you change and upgrade model versions\""
    source_url: "https://platform.openai.com/docs/guides/prompt-engineering"
    source_type: "first-party technical documentation"
    source_date: "2026-07-22"
    access_method: "jina_read direct URL"
    context: "Accessed 2026-07-18. Version-sensitive OpenAI API documentation; applicable to OpenAI production API practice and useful as a general caution against universal prompt claims, but not independent academic evidence across all vendors."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F002"
    claim: "A production prompt can be structured with distinct authority levels and sections such as identity, instructions, examples, and context; OpenAI documents developer messages as prioritized ahead of user messages."
    claim_type: "fact"
    confidence: "high"
    raw_data: "source_title: Prompt engineering | OpenAI API; evidence_type: first-party technical documentation; literal_excerpt: \"The OpenAI model spec describes how our models give different levels of priority to messages with different roles. developer messages are instructions provided by the application developer, prioritized ahead of user messages.\" Also: \"In general, a developer message will contain the following sections, usually in this order (though the exact optimal content and order may vary by which model you are using): Identity ... Instructions ... Examples ... Context\""
    source_url: "https://platform.openai.com/docs/guides/prompt-engineering"
    source_type: "first-party technical documentation"
    source_date: "2026-07-22"
    access_method: "jina_read direct URL"
    context: "Accessed 2026-07-18. Official OpenAI guidance; exact role names and authority semantics are vendor-specific, while the broader heuristic of separating task, rules, examples, and context is portable but should be evaluated per model."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F003"
    claim: "Few-shot examples can steer a model toward a task without fine-tuning, and first-party guidance recommends diverse examples with desired outputs."
    claim_type: "fact"
    confidence: "medium"
    raw_data: "source_title: Prompt engineering | OpenAI API; evidence_type: first-party technical documentation; literal_excerpt: \"Few-shot learning lets you steer a large language model toward a new task by including a handful of input/output examples in the prompt, rather than fine-tuning the model. The model implicitly 'picks up' the pattern from those examples and applies it to a prompt. When providing examples, try to show a diverse range of possible inputs with the desired outputs.\""
    source_url: "https://platform.openai.com/docs/guides/prompt-engineering"
    source_type: "first-party technical documentation"
    source_date: "2026-07-22"
    access_method: "jina_read direct URL"
    context: "Accessed 2026-07-18. Supports a practitioner heuristic for demonstration inclusion and diversity; this finding does not resolve optimal example-selection algorithms or ordering effects."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F004"
    claim: "Chain-of-thought prompting improved performance on arithmetic, commonsense, and symbolic reasoning tasks in experiments with three large language models, but the original claim is scoped to sufficiently large models and complex reasoning tasks."
    claim_type: "fact"
    confidence: "high"
    raw_data: "source_title: Chain-of-Thought Prompting Elicits Reasoning in Large Language Models; evidence_type: academic paper, arXiv record; literal_excerpt: \"We explore how generating a chain of thought -- a series of intermediate reasoning steps -- significantly improves the ability of large language models to perform complex reasoning. In particular, we show how such reasoning abilities emerge naturally in sufficiently large language models via a simple method called chain of thought prompting, where a few chain of thought demonstrations are provided as exemplars in prompting. Experiments on three large language models show that chain of thought prompting improves performance on a range of arithmetic, commonsense, and symbolic reasoning tasks.\""
    source_url: "https://arxiv.org/abs/2201.11903"
    source_type: "academic paper arXiv record"
    source_date: "2023-01-12"
    access_method: "jina_read direct URL"
    context: "Submitted 2022-01-28; last revised 2023-01-10 version v6. The excerpt supports CoT for complex reasoning in large models, not universal use for all tasks or smaller models."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F005"
    claim: "Self-consistency replaces greedy chain-of-thought decoding by sampling diverse reasoning paths and selecting the most consistent answer; reported gains are on selected arithmetic and commonsense benchmarks."
    claim_type: "fact"
    confidence: "high"
    raw_data: "source_title: Self-Consistency Improves Chain of Thought Reasoning in Language Models; evidence_type: peer-reviewed academic paper record; literal_excerpt: \"It first samples a diverse set of reasoning paths instead of only taking the greedy one, and then selects the most consistent answer by marginalizing out the sampled reasoning paths.\" Also: \"self-consistency boosts the performance of chain-of-thought prompting with a striking margin on a range of popular arithmetic and commonsense reasoning benchmarks, including GSM8K (+17.9%), SVAMP (+11.0%), AQuA (+12.2%), StrategyQA (+6.4%) and ARC-challenge (+3.9%).\""
    source_url: "https://arxiv.org/abs/2203.11171"
    source_type: "academic paper arXiv record; ICLR 2023"
    source_date: "2023-03-08"
    access_method: "jina_read direct URL"
    context: "Submitted 2022-03-21; camera-ready v4 2023-03-07; comments state Published at ICLR 2023. Applicability is strongest for answerable reasoning tasks where multiple sampled paths can converge on a unique answer; cost and latency increase with sampling."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F006"
    claim: "ReAct prompts interleave reasoning traces and task-specific actions, enabling models to update plans and use external sources or environments."
    claim_type: "fact"
    confidence: "high"
    raw_data: "source_title: ReAct: Synergizing Reasoning and Acting in Language Models; evidence_type: academic paper arXiv record; literal_excerpt: \"we explore the use of LLMs to generate both reasoning traces and task-specific actions in an interleaved manner, allowing for greater synergy between the two: reasoning traces help the model induce, track, and update action plans as well as handle exceptions, while actions allow it to interface with external sources, such as knowledge bases or environments, to gather additional information.\""
    source_url: "https://arxiv.org/abs/2210.03629"
    source_type: "academic paper arXiv record; ICLR camera-ready noted"
    source_date: "2023-03-13"
    access_method: "jina_read direct URL"
    context: "Submitted 2022-10-06; v3 ICLR camera-ready 2023-03-10. Supports tool-using agent patterns for QA, fact verification, and interactive decision benchmarks, not all tasks."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F007"
    claim: "For knowledge-intensive multi-step QA, one-step retrieve-and-read can be insufficient; interleaving retrieval with chain-of-thought improved retrieval and downstream QA in the IRCoT study."
    claim_type: "fact"
    confidence: "high"
    raw_data: "source_title: Interleaving Retrieval with Chain-of-Thought Reasoning for Knowledge-Intensive Multi-Step Questions; evidence_type: academic paper arXiv record, ACL 2023 camera-ready; literal_excerpt: \"While using the question to retrieve relevant text from an external knowledge source helps LLMs, we observe that this one-step retrieve-and-read approach is insufficient for multi-step QA. Here, what to retrieve depends on what has already been derived, which in turn may depend on what was previously retrieved.\" Also: \"Using IRCoT with GPT3 substantially improves retrieval (up to 21 points) as well as downstream QA (up to 15 points) on four datasets: HotpotQA, 2WikiMultihopQA, MuSiQue, and IIRC.\""
    source_url: "https://arxiv.org/abs/2212.10509"
    source_type: "academic paper arXiv record; ACL 2023 camera-ready"
    source_date: "2023-06-26"
    access_method: "jina_read direct URL"
    context: "Submitted 2022-12-20; v2 2023-06-23. Applicability is strongest for knowledge-intensive multi-hop QA; not evidence that retrieval interleaving helps simple single-hop tasks."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F008"
    claim: "Long-context models may not robustly use information regardless of position; performance can degrade when relevant information is in the middle of the context."
    claim_type: "fact"
    confidence: "high"
    raw_data: "source_title: Lost in the Middle: How Language Models Use Long Contexts; evidence_type: academic paper arXiv record, TACL 2023; literal_excerpt: \"We find that performance can degrade significantly when changing the position of relevant information, indicating that current language models do not robustly make use of information in long input contexts. In particular, we observe that performance is often highest when relevant information occurs at the beginning or end of the input context, and significantly degrades when models must access relevant information in the middle of long contexts, even for explicitly long-context models.\""
    source_url: "https://arxiv.org/abs/2307.03172"
    source_type: "academic paper arXiv record; TACL 2023"
    source_date: "2023-11-22"
    access_method: "jina_read direct URL"
    context: "Submitted 2023-07-06; v3 2023-11-20; accepted in Transactions of the Association for Computational Linguistics. Supports careful context placement and long-context evaluation; exact effects may vary by model generation and architecture."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F009"
    claim: "Adding relevant context in prompts is useful for proprietary or externally constrained data, but context windows impose token limits that require planning."
    claim_type: "fact"
    confidence: "medium"
    raw_data: "source_title: Prompt engineering | OpenAI API; evidence_type: first-party technical documentation; literal_excerpt: \"It is often useful to include additional context information the model can use to generate a response within the prompt you give the model.\" Also: \"The technique of adding additional relevant context to the model generation request is sometimes called retrieval-augmented generation (RAG).\" Also: \"Models can only handle so much data within the context they consider during a generation request. This memory limit is called a context window\""
    source_url: "https://platform.openai.com/docs/guides/prompt-engineering"
    source_type: "first-party technical documentation"
    source_date: "2026-07-22"
    access_method: "jina_read direct URL"
    context: "Accessed 2026-07-18. Practitioner guidance; should be combined with empirical long-context findings such as F008 for placement-sensitive production behavior."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F010"
    claim: "Structured outputs can be more reliable than prompt-only JSON formatting when a vendor supports schema-constrained generation."
    claim_type: "fact"
    confidence: "high"
    raw_data: "source_title: Structured model outputs | OpenAI API; evidence_type: first-party technical documentation; literal_excerpt: \"Structured Outputs is a feature that ensures the model will always generate responses that adhere to your supplied JSON Schema, so you don’t need to worry about the model omitting a required key, or hallucinating an invalid enum value.\" Also: \"Structured Outputs is the evolution of JSON mode. While both ensure valid JSON is produced, only Structured Outputs ensure schema adherence.\""
    source_url: "https://platform.openai.com/docs/guides/structured-outputs"
    source_type: "first-party technical documentation"
    source_date: "2026-07-22"
    access_method: "jina_read direct URL"
    context: "Accessed 2026-07-18. Version-sensitive OpenAI API feature claim; general lesson is to prefer enforceable decoding/API constraints over natural-language formatting instructions where supported."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F011"
    claim: "Function calling or tool interfaces are appropriate when connecting an LLM to tools, functions, or data; schema response formats are for structuring the model response itself."
    claim_type: "fact"
    confidence: "high"
    raw_data: "source_title: Structured model outputs | OpenAI API; evidence_type: first-party technical documentation; literal_excerpt: \"Function calling is useful when you are building an application that bridges the models and functionality of your application.\" Also: \"Put simply: If you are connecting the model to tools, functions, data, etc. in your system, then you should use function calling - If you want to structure the model’s output when it responds to the user, then you should use a structured response_format\""
    source_url: "https://platform.openai.com/docs/guides/structured-outputs"
    source_type: "first-party technical documentation"
    source_date: "2026-07-22"
    access_method: "jina_read direct URL"
    context: "Accessed 2026-07-18. Vendor-specific terminology, but supports the general design distinction between action/tool protocols and final-output schemas."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F012"
    claim: "Toolformer provides academic evidence that language models can be trained to decide when and how to call external APIs, improving zero-shot downstream performance across tested tasks."
    claim_type: "fact"
    confidence: "medium"
    raw_data: "source_title: Toolformer: Language Models Can Teach Themselves to Use Tools; evidence_type: academic paper arXiv record; literal_excerpt: \"We introduce Toolformer, a model trained to decide which APIs to call, when to call them, what arguments to pass, and how to best incorporate the results into future token prediction.\" Also: \"Toolformer achieves substantially improved zero-shot performance across a variety of downstream tasks, often competitive with much larger models, without sacrificing its core language modeling abilities.\""
    source_url: "https://arxiv.org/abs/2302.04761"
    source_type: "academic paper arXiv record"
    source_date: "2023-02-10"
    access_method: "jina_read direct URL"
    context: "Submitted 2023-02-09. This is training-method evidence for tool use, complementary to prompt-level ReAct evidence; not direct evidence that prompting alone yields Toolformer behavior."
    contradictions_expected: []
    debunks_finding_id: null
inferences_made:
  - id: "I001"
    based_on: ["F001", "F002", "F003", "F004", "F005", "F008", "F010"]
    inference_text: "A robust production prompt-engineering guide should present methods as candidates to evaluate by task and model: use clear instruction hierarchy and examples, use CoT or self-consistency primarily for complex reasoning when latency/cost allow, prefer structured-output APIs over prose-only JSON instructions where available, and benchmark long-context placement rather than assuming all context positions are equally usable."
    confidence: "high"
    caveats: "This synthesis combines first-party documentation and academic benchmarks; benchmark gains may not transfer to different model families, snapshots, domains, or latency budgets."
  - id: "I002"
    based_on: ["F006", "F007", "F009", "F011", "F012"]
    inference_text: "For production systems needing fresh facts, private data, actions, or external computation, prompt design should include explicit retrieval/tool protocols and evaluation of tool-call correctness, rather than relying solely on parametric model memory."
    confidence: "high"
    caveats: "Specific API mechanics vary by vendor; tool use also introduces security, reliability, permissioning, and observability requirements not fully covered by the accessed sources."
  - id: "I003"
    based_on: ["F001", "F004", "F005", "F008"]
    inference_text: "Anti-overgeneralization principle: do not encode any single prompt style, including chain-of-thought, ReAct, retrieval stuffing, or few-shot prompting, as universally optimal; instead document applicability, limitations, and eval gates for each method."
    confidence: "high"
    caveats: "The evidence base is strongest for published benchmark tasks and OpenAI documentation; some model vendors or later model generations may alter best practices."
gaps_identified:
  - "Direct retrieval of arXiv records for least-to-most prompting, automatic prompt optimization, and some prompt-selection literature was attempted but failed with HTTP 429; no claims about those papers are included beyond this gap."
  - "Anthropic and Google Cloud first-party prompt-engineering/evaluation documentation were attempted but failed with HTTP 429; cross-vendor official corroboration remains incomplete."
  - "The package uses OpenAI documentation for several production heuristics; those claims are version-sensitive and should be rechecked before treating them as permanent."
  - "No exhaustive systematic review or meta-analysis was retrieved; empirical findings should be treated as method-specific, benchmark-specific evidence rather than universal laws."
