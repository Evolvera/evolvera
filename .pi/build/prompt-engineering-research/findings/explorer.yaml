findings:
  - id: "F001"
    claim: "OpenAI's current API prompt guide distinguishes reasoning from GPT models, specifies Responses API instruction authority, and warns that prompt behavior may differ by snapshot."
    claim_type: "fact"
    confidence: "high"
    raw_data:
      provider: "OpenAI"
      model_family: "GPT models and OpenAI reasoning models"
      exact_applicability: "OpenAI API; document examples use Responses API and gpt-5.6. It explicitly says different model types and snapshots can require different prompting."
      official_source_url: "https://platform.openai.com/docs/guides/prompt-engineering"
      title: "Prompt engineering | OpenAI API"
      date_version: null
      literal_excerpt: "Some prompt engineering techniques work with every model, like using message roles. But different model types (like reasoning versus GPT models) might need to be prompted differently to produce the best results. Even different snapshots of models within the same family could produce different results."
      actionable_guidance: "Resolve and pin the exact snapshot; use developer/instructions for application rules and user for inputs; put reusable prefix content first for cache hits; use Structured Outputs rather than merely requesting JSON. Give reasoning models high-level goals and GPT models explicit logic."
      incompatibilities_or_caveats: "The instructions parameter is request-local and is not retained with previous_response_id. Do not assume output text is output[0].content[0].text. Saved prompt objects are being deprecated; verify the deprecation timeline at runtime."
    source_url: "https://platform.openai.com/docs/guides/prompt-engineering"
    source_type: "official API documentation"
    source_date: null
    access_method: "Jina Reader"
    context: "The page additionally recommends pinning production applications to model snapshots and building evaluations when changing versions."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F002"
    claim: "Anthropic maintains a current-model prompting reference with separate guides for named Claude versions and version-sensitive thinking and prefill migration guidance."
    claim_type: "fact"
    confidence: "high"
    raw_data:
      provider: "Anthropic"
      model_family: "Current Claude models; separate linked guides for Claude Fable 5/Mythos 5, Sonnet 5, and Opus 4.8"
      exact_applicability: "Anthropic Claude API current models, subject to each linked model-specific guide. The page explicitly distinguishes Claude 4.6+ and later behavior from earlier models."
      official_source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"
      title: "Prompting best practices"
      date_version: null
      literal_excerpt: "Put longform data at the top: Place your long documents and inputs near the top of your prompt, above your query, instructions, and examples."
      actionable_guidance: "For long context, put documents first and query last; tag instructions, context, inputs, and examples with consistent XML; use 3–5 relevant, diverse examples; select thinking/effort only after resolving the exact model; explicitly direct tool use."
      incompatibilities_or_caveats: "Do not carry prefilled-final-assistant-message patterns to Claude 4.6+; those requests return 400. budget_tokens is deprecated for Opus 4.6/Sonnet 4.6 and returns 400 on Opus 4.7+, Fable 5, and Mythos 5; use the exact model guide before choosing adaptive thinking or effort."
    source_url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"
    source_type: "official API documentation"
    source_date: null
    access_method: "Jina Reader"
    context: "The document calls itself the reference for Claude's latest models and links separate per-model prompting pages; use those before treating general guidance as applicable."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F003"
    claim: "Google's Gemini API guide gives Gemini 3-specific direction on delimiters, long-context ordering, automatic thinking, and output controls."
    claim_type: "fact"
    confidence: "high"
    raw_data:
      provider: "Google"
      model_family: "Gemini API, with a dedicated Gemini 3 section; references Gemini 2.5 and 3 thinking"
      exact_applicability: "Google Gemini API documentation. Gemini 3 recommendations are not stated as applying to earlier Gemini families; Vertex AI guidance was not retrieved."
      official_source_url: "https://ai.google.dev/gemini-api/docs/prompting-strategies"
      title: "Prompt design strategies"
      date_version: null
      literal_excerpt: "Structure for long contexts: When providing large amounts of context (e.g., documents, code), supply all the context first. Place your specific instructions or questions at the very end of the prompt."
      actionable_guidance: "For Gemini 3, use either consistent XML-style tags or Markdown headings, put critical constraints in system instruction or prompt beginning, put large context before the final task, and use API structured output for complex schemas. Tune temperature/topK/topP/max-output-tokens only where supported by the resolved model."
      incompatibilities_or_caveats: "The page states Gemini 2.5 and 3 automatically generate internal thinking, so requesting returned chain-of-thought is generally unnecessary. Parameter availability differs by model. Do not transfer Gemini API guidance to Vertex AI without checking the corresponding Vertex documentation."
    source_url: "https://ai.google.dev/gemini-api/docs/prompting-strategies"
    source_type: "official Gemini API documentation"
    source_date: null
    access_method: "Jina Reader"
    context: "The page identifies Gemini 3 models as advanced reasoning/instruction-following models and provides separate multimodal, image, and video prompt-guide links."
    contradictions_expected: []
