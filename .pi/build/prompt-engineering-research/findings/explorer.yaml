inferences_made:
  - id: "I001"
    based_on: ["F001", "F002", "F003", "F004", "F005", "F006", "F007", "F008"]
    inference_text: "Runtime lookup protocol: (1) capture provider, endpoint/API mode, exact requested model string, resolved model/version or snapshot returned by the API, SDK/API version, region, and enabled features; (2) normalize aliases only using the maker's current model catalog; (3) locate the maker's exact model page, API feature reference, migration/release note, and—where weights are used—the exact checkpoint model card/tokenizer chat template; (4) extract only advice whose applicability explicitly covers that model and delivery mode; (5) configure roles, reasoning/thinking, tools, response schema, caching, multimodal ordering, context placement, and sampling from that evidence; (6) pin the version and run regression evaluations whenever model, API, or prompt changes; (7) if exact evidence is unavailable, report UNKNOWN and use conservative portable wording rather than importing vendor-specific prompt syntax."
    confidence: "high"
    caveats: "Documentation can change after lookup and aliases can silently retarget. API-resolved model identifiers, feature errors, and current official release notes take precedence over cached skill knowledge. General guidance must not be promoted to model-specific guidance."
