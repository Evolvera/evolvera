  - id: "F004"
    claim: "Mistral's official prompting guide defines system and user levels, recommends Markdown/XML structure and examples, and directs developers to enforced structured outputs."
    claim_type: "fact"
    confidence: "high"
    raw_data:
      provider: "Mistral AI"
      model_family: "Mistral models generally; no model-version-specific prompting applicability is asserted on this page"
      exact_applicability: "Mistral documentation guidance presented as general to Mistral models and other LLMs; exact model/API feature support must be resolved separately."
      official_source_url: "https://docs.mistral.ai/guides/prompting_capabilities/"
      title: "Prompting | Mistral Docs"
      date_version: null
      literal_excerpt: "When providing instructions, there are two levels of input you can give the model: `system` and `user`."
      actionable_guidance: "Put durable behavioral context in system, task-specific context in user; use clear hierarchical Markdown or XML-style sections; provide few-shot interactions when output format matters; use the structured-output feature for predictable JSON."
      incompatibilities_or_caveats: "This is provider-wide guidance, not evidence that each Mistral model supports the same roles, JSON enforcement, tools, or sampling parameters. The guide itself warns that model updates can change prompt behavior; resolve model documentation and evaluate after upgrades."
    source_url: "https://docs.mistral.ai/guides/prompting_capabilities/"
