agent_id: "skeptical"
tema: "Empirical support for prompt-engineering methods versus folklore"
data_coleta: "2026-07-18"
missao_id: null
missao_cumprida: true
justificativa_missao: "Primary papers and official provider documentation were checked with jina_read where accessible. Evidence supports eval-driven, task-specific prompt development; few-shot examples; chain-of-thought for selected reasoning tasks and sufficiently large models; automatic/data-driven prompt optimization; model/version pinning; and structured outputs for schema adherence. Evidence is weaker or highly conditional for universal templates, persona prompts, politeness, emotional language, and magic phrases. Several requested sources, especially Anthropic docs and some arXiv papers, were inaccessible due to HTTP 429 and are logged as gaps."
findings:
  - id: "F001"
    claim: "Chain-of-thought prompting has primary empirical support for arithmetic, commonsense, and symbolic reasoning tasks, but the original claim is scoped to selected large models and reasoning benchmarks rather than universal prompting."
    claim_type: "fact"
    confidence: "high"
    raw_data: "Abstract excerpt: 'We explore how generating a chain of thought -- a series of intermediate reasoning steps -- significantly improves the ability of large language models to perform complex reasoning... Experiments on three large language models show that chain of thought prompting improves performance on a range of arithmetic, commonsense, and symbolic reasoning tasks.'"
    source_url: "https://arxiv.org/abs/2201.11903"
    source_type: "primary paper, arXiv"
    source_date: "2023-01-12"
    access_method: "jina_read"
    context: "The paper reports experiments on three large language models and specific arithmetic, commonsense, and symbolic reasoning tasks. The evidence supports task- and scale-conditional use of CoT, not a claim that visible reasoning always improves every model or task."
    contradictions_expected: ["Later reasoning-model provider guidance may discourage forcing explicit chain-of-thought or may use hidden reasoning instead; that is not a direct contradiction of this older few-shot CoT result but changes applicability."]
    debunks_finding_id: null
  - id: "F002"
    claim: "Automatic Chain-of-Thought provides primary empirical support for data-driven/decomposition-style prompt construction and shows dependence on example diversity and generated-chain errors."
    claim_type: "fact"
    confidence: "high"
    raw_data: "Abstract excerpt: 'The superior performance of the second paradigm hinges on the hand-crafting of task-specific demonstrations one by one... However, these generated chains often come with mistakes. To mitigate the effect of such mistakes, we find that diversity matters... On ten public benchmark reasoning tasks with GPT-3, Auto-CoT consistently matches or exceeds the performance of the CoT paradigm that requires manual designs of demonstrations.'"
    source_url: "https://arxiv.org/abs/2210.03493"
    source_type: "primary paper, arXiv"
    source_date: "2022-10-10"
    access_method: "jina_read"
    context: "Experimental scope is ten public reasoning benchmarks with GPT-3. It supports comparing prompt variants using benchmark tasks and diverse demonstrations, while warning that generated rationales can contain mistakes."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F003"
    claim: "Automatic Prompt Optimization supports eval-driven prompt development using training data, minibatches, search, and held-out task performance, but results are preliminary and task/API-dependent."
    claim_type: "fact"
    confidence: "high"
    raw_data: "Abstract excerpt: 'We propose a simple and nonparametric solution... Automatic Prompt Optimization (APO)... assuming access to training data and an LLM API... Preliminary results across three benchmark NLP tasks and the novel problem of LLM jailbreak detection suggest that Automatic Prompt Optimization can outperform prior prompt editing techniques and improve an initial prompt's performance by up to 31%.'"
    source_url: "https://arxiv.org/abs/2305.03495"
    source_type: "primary paper, EMNLP 2023/arXiv"
    source_date: "2023-10-20"
    access_method: "jina_read"
    context: "The 'up to 31%' statistic is explicitly preliminary, depends on selected benchmark NLP tasks and jailbreak detection, and assumes training data plus an LLM API. It supports systematic prompt search over ad hoc trial-and-error, not universal improvement."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F004"
    claim: "Official OpenAI guidance supports prompt tests, evaluation suites, and model snapshot pinning because outputs are nondeterministic and behavior can vary by model type and snapshot."
    claim_type: "fact"
    confidence: "high"
    raw_data: "Excerpt: 'Because the content generated from a model is non-deterministic, prompting to get your desired output is a mix of art and science... different model types... might need to be prompted differently... Even different snapshots of models within the same family could produce different results. So as you build more complex applications, we strongly recommend: Pinning your production applications to specific model snapshots... Building tests and evaluation suites that measure prompt behavior so you can monitor performance as you iterate, or when you change and upgrade model versions.'"
    source_url: "https://platform.openai.com/docs/guides/prompt-engineering"
    source_type: "official provider documentation"
    source_date: "2026-07-22"
    access_method: "jina_read"
    context: "Documentation date is after the user-specified current date, so it should be treated as current provider guidance rather than evidence available on 2026-07-18. It directly supports versioning, held-out prompt tests, and regression monitoring."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F005"
    claim: "Official OpenAI guidance supports few-shot examples, explicit instructions, relevant context/RAG, and different prompting strategies for GPT versus reasoning models."
    claim_type: "fact"
    confidence: "high"
    raw_data: "Excerpts: 'Few-shot learning lets you steer a large language model toward a new task by including a handful of input/output examples in the prompt'; 'GPT models... benefit from more explicit instructions'; 'reasoning models will provide better results on tasks with only high-level guidance. This differs from GPT models, which benefit from very precise instructions.'"
    source_url: "https://platform.openai.com/docs/guides/prompt-engineering"
    source_type: "official provider documentation"
    source_date: "2026-07-22"
    access_method: "jina_read"
    context: "Provider guidance is model-family-specific and explicitly warns that optimal content and order may vary by model. It supports few-shot and context inclusion as practical methods, not as model-agnostic rules."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F006"
    claim: "Structured Outputs have official support as a stronger alternative to prompting for JSON formatting when schema adherence is required."
    claim_type: "fact"
    confidence: "high"
    raw_data: "Excerpts: 'Structured Outputs is a feature that ensures the model will always generate responses that adhere to your supplied JSON Schema'; 'Structured Outputs vs JSON mode... While both ensure valid JSON is produced, only Structured Outputs ensure schema adherence'; 'We recommend always using Structured Outputs instead of JSON mode when possible.'"
    source_url: "https://platform.openai.com/docs/guides/structured-outputs"
    source_type: "official provider documentation"
    source_date: "2026-07-22"
    access_method: "jina_read"
    context: "This is provider feature documentation, not an independent benchmark. It strongly supports replacing fragile 'please output valid JSON' prompt tricks with schema-constrained APIs where available, subject to supported model/schema limits."
    contradictions_expected: []
    debunks_finding_id: null
  - id: "F007"
    claim: "Prompt pattern catalogs document reusable templates but, from the accessible abstract, do not establish universal empirical validity."
    claim_type: "fact"
    confidence: "medium"
    raw_data: "Abstract excerpt: 'This paper describes a catalog of prompt engineering techniques presented in pattern form... Prompt patterns are a knowledge transfer method analogous to software patterns... illustrates prompt patterns that benefit from combination with other prompt patterns.'"
    source_url: "https://arxiv.org/abs/2302.11382"
    source_type: "paper, arXiv"
    source_date: "2023-02-23"
    access_method: "jina_read"
    context: "The accessible abstract describes a catalog and examples of successful use, not controlled experiments across models/tasks. It is useful design vocabulary but weak support for universal templates."
    contradictions_expected: []
    debunks_finding_id: null
inferences_made:
  - id: "I001"
    based_on: ["F001", "F002", "F003", "F004", "F005"]
    inference_text: "Methods with the strongest support are task-specific few-shot prompting, chain-of-thought for selected reasoning benchmarks and sufficiently capable models, decomposition when evaluated on reasoning tasks, and data/eval-driven prompt optimization. They should be treated as hypotheses to test per model, task, and version."
    confidence: "high"
    caveats: "Evidence is strongest for benchmarked reasoning/NLP tasks and official provider workflows. It does not prove gains for all domains, safety-critical settings, or future model snapshots."
  - id: "I002"
    based_on: ["F004", "F006"]
    inference_text: "Teams should compare zero-shot, few-shot, decomposition, tool use, structured outputs, and model changes using pre-registered eval sets, fixed model snapshots, identical decoding settings, multiple runs where stochasticity matters, cost/latency tracking, and failure-slice analysis; production changes should be versioned and regression-tested."
    confidence: "high"
    caveats: "Provider documentation supports testing and version pinning, but does not specify statistical test designs. Teams must choose sample sizes, confidence intervals, and practical significance thresholds appropriate to their risk."
  - id: "I003"
    based_on: ["F001", "F002", "F004", "F005", "F007"]
    inference_text: "Claims about universal prompt templates, magic phrases, persona prompts, politeness, or emotional language are weak or misleading unless demonstrated on the exact model/task/version. Available checked sources either limit claims by task/model or provide pattern catalogs rather than controlled universal evidence."
    confidence: "medium"
    caveats: "Some primary papers on emotional prompts or persona prompts could not be accessed in this run due to HTTP 429, so this is an evidence-quality assessment rather than a proof that such prompts never help."
  - id: "I004"
    based_on: ["F003", "F004", "F006"]
    inference_text: "Compact validation framework for prompt experiments: define task and success metric; freeze model snapshot, tools, retrieval corpus, decoding parameters, and prompt version; reserve a held-out test set; compare baselines and variants with identical budgets; run ablations for each prompt component; repeat stochastic runs or seeds; report mean, variance, confidence intervals, cost, latency, and refusal/error rates; inspect failure slices by input type; promote only changes that improve held-out performance without unacceptable regressions; archive prompt, data hashes, outputs, grader rubric, and decision rationale."
    confidence: "high"
    caveats: "This framework is synthesized from provider guidance and empirical prompt-optimization practice; exact statistical thresholds require domain-specific risk calibration."
gaps_identified:
  - "Anthropic documentation URLs requested for eval tooling and prompt engineering returned HTTP 429 via jina_read, so their literal guidance could not be verified."
  - "Several potentially relevant primary papers on self-consistency, ReAct/tool use, emotional stimuli, and prompt sensitivity returned HTTP 429 from arXiv via jina_read in this run."
  - "No accessible primary evidence in this run established that persona prompts, politeness, emotional language, magic phrases, or universal templates reliably improve performance across models and tasks."
  - "OpenAI documentation retrieved by jina_read showed publication/access timestamps of 2026-07-22, later than the user-stated current date of 2026-07-18; it is logged but date-sensitive consumers should re-check archival availability."
