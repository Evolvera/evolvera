validation_memo:
  tema: "Best-supported prompt-engineering methods for production LLM systems"
  data_auditoria: "2026-07-18"
  total_findings_recebidos: 42
  total_sources_recebidos: 61

violacoes_glossario:
  - codigo: "LOG-03"
    finding_id: "methodical:F001"
    agent: "methodical"
    descricao: "Repeated OpenAI documentation is one provider-specific source, not independent cross-provider triangulation."
    severidade: "material"
    correcao: "Present as provider-specific guidance and validate on exact maker, host, model and API."
  - codigo: "LOG-03"
    finding_id: "explorer:F001"
    agent: "explorer"
    descricao: "The excerpt supports model/snapshot differences but not every cache, deprecation, persistence and response-access subclaim."
    severidade: "material"
    correcao: "Keep only directly supported claims and require exact current API verification."
  - codigo: "LOG-05"
    finding_id: "methodical:F004"
    agent: "methodical"
    descricao: "Historical CoT evidence is scoped to tested models and tasks."
    severidade: "material"
    correcao: "Label as historical candidate evidence and require target-model held-out validation."

contradicoes:
  - id: "C001"
    descricao: "Provider guidance differs on context and instruction ordering."
    implicacao: "material: there is no universal prompt section order."
    resolvida: true
    missao_fase3: null
  - id: "C002"
    descricao: "Explicit CoT benchmark gains coexist with current reasoning models that use internal thinking and may not need exposed CoT."
    implicacao: "material: CoT is model/task conditional, never a universal requirement."
    resolvida: true
    missao_fase3: null
  - id: "C003"
    descricao: "Several findings expose 2026-07-22 metadata after the 2026-07-18 cutoff."
    implicacao: "material: future metadata is discarded; publication dates remain unknown unless independently verified."
    resolvida: true
    missao_fase3: null

gaps_triangulacao:
  - claim_id: "explorer:I001"
    problema: "No concrete runtime was supplied."
    recomendacao: "At execution, resolve maker, provider, host, endpoint/API, exact model/snapshot, SDK/API version, region and features; use UNKNOWN when unavailable."
  - claim_id: "explorer:F006-F008"
    problema: "Current official prompting guidance for xAI, DeepSeek and Qwen/Model Studio was not recovered."
    recomendacao: "Do not import another provider's syntax; find exact official guidance at execution time or report UNKNOWN."
  - claim_id: "skeptical:I002/I004"
    problema: "Evidence supports evaluation and pinning but no universal promotion threshold."
    recomendacao: "Define risk-specific held-out quality, cost, latency and failure-slice gates."
  - claim_id: "phase3:VI002"
    problema: "No concrete runtime adversarial or held-out test was executed."
    recomendacao: "Require target-specific tests before consequential promotion; do not claim application security."
  - claim_id: "creative:I006"
    problema: "Rollback and observability are engineering requirements, not fully triangulated universal provider behavior."
    recomendacao: "Treat them as explicit production policy with versioned artifacts and tested reversal."
  - claim_id: "methodical:I001/I002/I003"
    problema: "CoT, self-consistency, ReAct, IRCoT, structured outputs and long-context findings are model/task/provider scoped."
    recomendacao: "Document them as evaluated candidates, not guarantees."

plano_validacao:
  - missao_id: "M001"
    objetivo: "Resolve target runtime identity and documentation scope."
    instrucao: "Record maker/provider/host/API/model/version/SDK/features and consult matching official guidance."
    agente_ideal: "methodical"
    criterio_sucesso: "Every field is known or explicitly UNKNOWN; no unsupported vendor-specific advice is applied."
    max_turnos: 3
  - missao_id: "M002"
    objetivo: "Produce prompt-variant promotion evidence."
    instrucao: "Compare baseline and variants on held-out cases measuring quality, cost, latency and failure slices."
    agente_ideal: "methodical"
    criterio_sucesso: "Comparable versioned results exist; no unexecuted test is reported as approval."
    max_turnos: 3
  - missao_id: "M003"
    objetivo: "Validate the concrete application's security boundary."
    instrucao: "Test injection, untrusted content, many-shot attacks, tools, permissions, refusals and truncation/schema failures."
    agente_ideal: "critical"
    criterio_sucesso: "Attacks, controls, results and residual failures are recorded; prompts are not treated as a trust boundary."
    max_turnos: 3

conclusao_auditor:
  status_geral: "aprovado_com_ressalvas"
  justificativa: "Phase 3 removes the publication blocker. The guide may be permanent as a bounded methodology and PI skill requiring exact runtime identity, current official maker/host research, UNKNOWN handling, explicit contracts, held-out evaluation, versioning, rollback and controls outside prompt prose. It certifies no concrete runtime and makes no exhaustive security claim."
  confianca_maxima_permitida: "medium"
